apply plugin: 'com.android.application'

android {
    namespace "studio.littleelsewhere.soundscript"
    compileSdk 34

    defaultConfig {
        applicationId "studio.littleelsewhere.soundscript"
        minSdk 22
        targetSdk 34
        versionCode (System.getenv("APP_VERSION_CODE") ?: "1") as int
        versionName System.getenv("APP_VERSION_NAME") ?: "1.6.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (System.getenv("KS_PATH")) {
                storeFile file(System.getenv("KS_PATH"))
                storePassword System.getenv("KS_STORE_PASSWORD")
                keyAlias System.getenv("KS_KEY_ALIAS")
                keyPassword System.getenv("KS_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("KS_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', '../capacitor-cordova-android-plugins/src/main/jniLibs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found")
}
