<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoundScript — ricezione audio</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:20px;box-sizing:border-box}
@media (prefers-color-scheme:dark){body{background:#0f172a;color:#f1f5f9}}
.box{max-width:420px;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:28px 24px;box-shadow:0 4px 16px rgba(15,23,42,.08)}
@media (prefers-color-scheme:dark){.box{background:#1e293b;border-color:#334155}}
h1{font-size:1.35rem;margin:0 0 10px}
p{font-size:.95rem;line-height:1.55;color:#64748b;margin:0 0 10px}
@media (prefers-color-scheme:dark){p{color:#94a3b8}}
.btn{display:inline-block;margin-top:8px;padding:12px 22px;border-radius:999px;background:linear-gradient(135deg,#4f46e5,#06b6d4);color:#fff;font-weight:600;text-decoration:none}
.spin{width:26px;height:26px;margin:0 auto 14px;border:3px solid #e2e8f0;border-top-color:#4f46e5;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<main class="box">
  <div id="wait">
    <div class="spin"></div>
    <h1 id="waitT">Ricezione audio…</h1>
    <p id="waitD">Recupero l'audio condiviso da WhatsApp.</p>
  </div>
  <div id="first" hidden>
    <h1 id="firstT">Quasi fatto!</h1>
    <p id="firstD1"></p>
    <p id="firstD2"></p>
    <a class="btn" href="./" data-open>Apri SoundScript</a>
  </div>
  <div id="err" hidden>
    <h1 id="errT">Audio non ricevuto</h1>
    <p id="errD"></p>
    <a class="btn" href="./" data-open>Apri SoundScript</a>
  </div>
</main>
<script src="./share-target.js" defer></script>
</body>
</html>
