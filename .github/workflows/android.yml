name: android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: false

env:
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.1.0"
  ANDROID_MIN_SDK: "24"

jobs:
  build:
    name: TWA · build, gate, artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'

      - name: Prepara le due forme dell'SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "::error::SDK non trovata in $SDK"; exit 1; }
          mkdir -p "$SDK/cmdline-tools"
          if [ ! -e "$SDK/cmdline-tools/latest" ]; then
            VER=$(ls -1 "$SDK/cmdline-tools" 2>/dev/null | grep -v '^latest$' | sort -V | tail -1 || true)
            [ -n "$VER" ] || { echo "::error::nessuna cmdline-tools versionata"; exit 1; }
            ln -sfn "$SDK/cmdline-tools/$VER" "$SDK/cmdline-tools/latest"
          fi
          CT="$SDK/cmdline-tools/latest"
          yes 2>/dev/null | "$CT/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$CT/bin/sdkmanager" --sdk_root="$SDK" --install \
            "platform-tools" "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" >/dev/null
          for d in licenses platform-tools platforms build-tools extras; do
            if [ -e "$SDK/$d" ]; then ln -sfn "$SDK/$d" "$CT/$d"; fi
          done
          yes 2>/dev/null | "$CT/bin/sdkmanager" --sdk_root="$CT" --licenses >/dev/null 2>&1 || true
          for d in bin lib; do
            if [ -e "$CT/$d" ]; then ln -sfn "$CT/$d" "$SDK/$d"; fi
          done
          echo "── root reale ──"; ls -1 "$SDK"
          echo "── cmdline-tools/latest ──"; ls -1 "$CT"
          echo "SDK_REAL=$SDK" >> "$GITHUB_ENV"
          echo "SDK_CT=$CT" >> "$GITHUB_ENV"

      - name: Verifica prerequisiti del repo
        run: |
          test -f twa-manifest.json || { echo "::error::twa-manifest.json assente alla root"; exit 1; }
          test -f scripts/verify-apk.mjs || { echo "::error::scripts/verify-apk.mjs assente"; exit 1; }
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 mancante"; exit 1; }
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" || { echo "::error::Secret ANDROID_KEYSTORE_PASSWORD mancante"; exit 1; }
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}" || { echo "::error::Secret ANDROID_KEY_PASSWORD mancante"; exit 1; }

      # androidbrowserhelper 2.7.4 dichiara minSdk 24. Con 21 il manifest
      # merger si ferma: "uses-sdk:minSdkVersion 21 cannot be smaller than
      # version 24 declared in library". Allineiamo il manifest prima che
      # bubblewrap generi il progetto, così il valore è giusto alla nascita.
      # tools:overrideLibrary non è un'alternativa: forzerebbe l'uso di API
      # non presenti su Android 5/6, con crash a runtime.
      - name: Allinea minSdkVersion al vincolo della libreria
        run: |
          node -e "
            const fs = require('fs');
            const p = './twa-manifest.json';
            const MIN = parseInt(process.env.ANDROID_MIN_SDK, 10);
            const m = JSON.parse(fs.readFileSync(p, 'utf8'));
            const before = m.minSdkVersion;
            if (!Number.isFinite(before) || before < MIN) {
              m.minSdkVersion = MIN;
              fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
              console.log('minSdkVersion: ' + before + ' -> ' + MIN);
            } else {
              console.log('minSdkVersion già conforme: ' + before);
            }
            if (!m.shareTarget) { console.error('::error::twa-manifest.json senza shareTarget'); process.exit(1); }
            if (m.shareTarget.method !== 'POST') { console.error('::error::shareTarget.method deve essere POST'); process.exit(1); }
            console.log('shareTarget: ' + m.shareTarget.action + ' · versionCode: ' + m.appVersionCode);
          "
          node -e "
            const m = require('./twa-manifest.json');
            const MIN = parseInt(process.env.ANDROID_MIN_SDK, 10);
            if (m.minSdkVersion < MIN) { console.error('::error::minSdkVersion ancora ' + m.minSdkVersion); process.exit(1); }
            console.log('Vincolo soddisfatto: minSdk ' + m.minSdkVersion + ' (Android ' + (m.minSdkVersion === 24 ? '7.0' : m.minSdkVersion) + '+)');
          "

      - name: Ricostruisci il keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -u
          CLEAN=$(printf '%s' "$KS_B64" | tr -d '[:space:]')
          printf '%s' "$CLEAN" | base64 -d > android.keystore
          chmod 600 android.keystore
          OPENED=""
          for T in PKCS12 JKS JCEKS; do
            if keytool -list -keystore android.keystore -storetype "$T" -storepass "$KS_PASS" >/dev/null 2>/tmp/kterr; then
              OPENED="$T"; echo "aperto come $T"; break
            fi
          done
          [ -n "$OPENED" ] || { echo "::error::keystore non apribile"; head -8 /tmp/kterr; exit 1; }
          echo "ANDROID_KEYSTORE_TYPE=$OPENED" >> "$GITHUB_ENV"

      - name: Installa Bubblewrap
        run: npm install --no-audit --no-fund --ignore-scripts -g @bubblewrap/cli

      - name: Scegli e allinea il percorso SDK
        run: |
          set -u
          mkdir -p "$HOME/.bubblewrap"
          CHOSEN=""
          for CAND in "$SDK_REAL" "$SDK_CT"; do
            echo "=== candidato: $CAND ==="
            printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' \
              "$JAVA_HOME" "$CAND" > "$HOME/.bubblewrap/config.json"
            if printf 'y\n' | bubblewrap doctor >/tmp/doc 2>&1; then
              echo ">>> doctor ACCETTA $CAND"
              CHOSEN="$CAND"; break
            else
              echo "doctor rifiuta:"; tail -4 /tmp/doc
            fi
          done
          if [ -z "$CHOSEN" ]; then
            echo "::error::Nessun percorso accettato da doctor."
            cat /tmp/doc || true
            exit 1
          fi
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' \
            "$JAVA_HOME" "$CHOSEN" > "$HOME/.bubblewrap/config.json"
          echo "ANDROID_HOME=$CHOSEN" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$CHOSEN" >> "$GITHUB_ENV"
          echo "BW_SDK=$CHOSEN" >> "$GITHUB_ENV"
          echo "$CHOSEN/bin" >> "$GITHUB_PATH"
          echo "$CHOSEN/platform-tools" >> "$GITHUB_PATH"
          cat "$HOME/.bubblewrap/config.json"

      - name: Genera il progetto Android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -u
          printf 'y\ny\ny\n' | bubblewrap update || echo "::warning::update non-zero, verifico lo stato"
          ls -1
          test -f app/build.gradle && echo "progetto Android presente" || { echo "::error::app/build.gradle assente"; exit 1; }
          echo "── minSdk nel progetto generato ──"
          grep -n "minSdk" app/build.gradle || true
          echo "── minSdk nel manifest sorgente ──"
          grep -n "uses-sdk\|minSdkVersion" app/src/main/AndroidManifest.xml || true

      - name: Allinea local.properties e verifica coerenza
        run: |
          set -u
          printf 'sdk.dir=%s\n' "$BW_SDK" > local.properties
          CFG=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.env.HOME+'/.bubblewrap/config.json','utf8')).androidSdkPath)")
          echo "ANDROID_HOME     = $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT = $ANDROID_SDK_ROOT"
          echo "config.json      = $CFG"
          echo "local.properties = $(sed 's/^sdk.dir=//' local.properties)"
          if [ "$ANDROID_HOME" != "$ANDROID_SDK_ROOT" ] || [ "$ANDROID_HOME" != "$CFG" ]; then
            echo "::error::Percorsi SDK divergenti: Gradle rifiuterebbe la build."
            exit 1
          fi
          MIN=$(node -e "console.log(require('./twa-manifest.json').minSdkVersion)")
          if [ "$MIN" -lt "$ANDROID_MIN_SDK" ]; then
            echo "::error::minSdk $MIN sotto il vincolo $ANDROID_MIN_SDK della libreria."
            exit 1
          fi
          echo "Percorsi allineati e minSdk $MIN conforme."

      - name: Build APK e AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -u
          printf 'sdk.dir=%s\n' "$BW_SDK" > local.properties
          printf 'y\ny\ny\n' | bubblewrap build --skipPwaValidation
          ls -1 *.apk *.aab 2>/dev/null || { echo "::error::nessun pacchetto prodotto"; exit 1; }

      - name: Gate · consegna condivisione
        run: node scripts/verify-apk.mjs app-release-signed.apk

      - name: Fingerprint della chiave
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "Fingerprint SHA-256 (deve coincidere con assetlinks.json):"
          keytool -list -v -keystore android.keystore \
            -storetype "${ANDROID_KEYSTORE_TYPE:-PKCS12}" -storepass "$KS_PASS" \
            | grep -A1 "SHA256:" || true

      - name: Rimuovi il keystore dal workspace
        if: always()
        run: shred -u android.keystore 2>/dev/null || rm -f android.keystore

      - name: Pubblica APK e AAB
        uses: actions/upload-artifact@v4
        with:
          name: soundscript-android
          path: |
            app-release-signed.apk
            app-release-bundle.aab
          retention-days: 30
          if-no-files-found: error
