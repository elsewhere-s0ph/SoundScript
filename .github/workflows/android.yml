name: android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: false

env:
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.1.0"

jobs:
  build:
    name: TWA · build, gate, artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'

      # SCOPERTA EMPIRICA: bubblewrap rifiuta la SDK root e accetta
      # cmdline-tools/latest. Ma quel percorso non contiene licenses,
      # platform-tools, platforms, build-tools: senza symlink, sdkmanager
      # lanciato da bubblewrap non trova le licenze già accettate e salta
      # i pacchetti ("Skipping following packages as the license is not accepted").
      - name: Rendi cmdline-tools/latest una SDK root completa
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "::error::SDK non trovata in $SDK"; exit 1; }

          mkdir -p "$SDK/cmdline-tools"
          if [ ! -e "$SDK/cmdline-tools/latest" ]; then
            VER=$(ls -1 "$SDK/cmdline-tools" 2>/dev/null | grep -v '^latest$' | sort -V | tail -1 || true)
            [ -n "$VER" ] || { echo "::error::nessuna cmdline-tools versionata"; exit 1; }
            ln -sfn "$SDK/cmdline-tools/$VER" "$SDK/cmdline-tools/latest"
          fi
          CT="$SDK/cmdline-tools/latest"
          echo "SDK root reale: $SDK"
          echo "Percorso per bubblewrap: $CT"

          yes 2>/dev/null | "$CT/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$CT/bin/sdkmanager" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" >/dev/null

          # I symlink trasformano cmdline-tools/latest in una SDK root valida:
          # bubblewrap trova bin/ e lib/ che pretende, più tutti i componenti.
          for d in licenses platform-tools platforms build-tools extras; do
            if [ -e "$SDK/$d" ]; then ln -sfn "$SDK/$d" "$CT/$d"; fi
          done

          # Licenze ri-accettate ANCHE con sdk_root = il percorso di bubblewrap,
          # così sdkmanager invoked by bubblewrap le vede.
          yes 2>/dev/null | "$CT/bin/sdkmanager" --sdk_root="$CT" --licenses >/dev/null 2>&1 || true

          echo "── contenuto di $CT ──"
          ls -la "$CT"
          echo "── licenze visibili da bubblewrap ──"
          ls -1 "$CT/licenses" || { echo "::error::cartella licenses assente"; exit 1; }
          echo "── build-tools ──"
          ls -1 "$CT/build-tools"
          echo "── platforms ──"
          ls -1 "$CT/platforms"

          test -d "$CT/build-tools/${ANDROID_BUILD_TOOLS}" || { echo "::error::build-tools ${ANDROID_BUILD_TOOLS} assente"; exit 1; }
          test -d "$CT/platforms/android-${ANDROID_API}" || { echo "::error::platform android-${ANDROID_API} assente"; exit 1; }

          echo "BW_SDK=$CT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$CT/bin" >> "$GITHUB_PATH"

      - name: Verifica prerequisiti del repo
        run: |
          test -f twa-manifest.json || { echo "::error::twa-manifest.json assente alla root"; exit 1; }
          test -f scripts/verify-apk.mjs || { echo "::error::scripts/verify-apk.mjs assente"; exit 1; }
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 mancante"; exit 1; }
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" || { echo "::error::Secret ANDROID_KEYSTORE_PASSWORD mancante"; exit 1; }
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}" || { echo "::error::Secret ANDROID_KEY_PASSWORD mancante"; exit 1; }
          node -e "const m=require('./twa-manifest.json'); if(!m.shareTarget){console.error('::error::twa-manifest.json senza shareTarget');process.exit(1)} if(m.shareTarget.method!=='POST'){console.error('::error::shareTarget.method deve essere POST');process.exit(1)} console.log('shareTarget:', m.shareTarget.action, '· alias:', (m.signingKey&&m.signingKey.alias)||'(assente)', '· versionCode:', m.appVersionCode)"

      - name: Ricostruisci il keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -u
          CLEAN=$(printf '%s' "$KS_B64" | tr -d '[:space:]')
          printf '%s' "$CLEAN" | base64 -d > android.keystore
          chmod 600 android.keystore
          echo "keystore: $(wc -c < android.keystore | tr -d ' ') byte"
          OPENED=""
          for T in PKCS12 JKS JCEKS; do
            if keytool -list -keystore android.keystore -storetype "$T" -storepass "$KS_PASS" >/dev/null 2>/tmp/kterr; then
              OPENED="$T"; echo "aperto come $T"; break
            fi
          done
          [ -n "$OPENED" ] || { echo "::error::keystore non apribile"; head -8 /tmp/kterr; exit 1; }
          echo "ANDROID_KEYSTORE_TYPE=$OPENED" >> "$GITHUB_ENV"

      - name: Installa Bubblewrap
        run: npm install --no-audit --no-fund --ignore-scripts -g @bubblewrap/cli

      - name: Configura Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' \
            "$JAVA_HOME" "$BW_SDK" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"
          printf 'y\n' | bubblewrap doctor || { echo "::error::doctor rifiuta la configurazione"; exit 1; }

      # Il prompt "No checksum file was found ... would you like to regenerate"
      # compare perché il progetto Android non è mai stato generato da init.
      # update lo crea dal twa-manifest.json e scrive manifest-checksum.txt.
      # stdin esplicito: senza, il prompt chiude il processo con exit 130.
      - name: Genera il progetto Android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -u
          printf 'y\ny\ny\n' | bubblewrap update || echo "::warning::update non-zero, verifico lo stato"
          echo "── file generati ──"
          ls -1
          if [ -f manifest-checksum.txt ]; then
            echo "manifest-checksum.txt presente"
          else
            echo "::warning::checksum assente: lo genererà il build"
          fi
          if [ -f app/build.gradle ]; then
            echo "progetto Android presente"
          else
            echo "::warning::app/build.gradle assente: il build dovrà rigenerare"
          fi

      - name: Build APK e AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf 'y\ny\ny\n' | bubblewrap build --skipPwaValidation
          ls -1 *.apk *.aab 2>/dev/null || { echo "::error::nessun pacchetto prodotto"; exit 1; }

      - name: Gate · consegna condivisione
        run: node scripts/verify-apk.mjs app-release-signed.apk

      - name: Fingerprint della chiave
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "Fingerprint SHA-256 (deve coincidere con assetlinks.json):"
          keytool -list -v -keystore android.keystore \
            -storetype "${ANDROID_KEYSTORE_TYPE:-PKCS12}" -storepass "$KS_PASS" \
            | grep -A1 "SHA256:" || true

      - name: Rimuovi il keystore dal workspace
        if: always()
        run: shred -u android.keystore 2>/dev/null || rm -f android.keystore

      - name: Pubblica APK e AAB
        uses: actions/upload-artifact@v4
        with:
          name: soundscript-android
          path: |
            app-release-signed.apk
            app-release-bundle.aab
          retention-days: 30
          if-no-files-found: error
