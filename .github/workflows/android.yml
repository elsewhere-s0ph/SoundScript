name: android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: false

env:
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  build:
    name: TWA · build, gate, artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: SDK · struttura, versioni, candidati
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "::error::SDK non trovato in $SDK"; exit 1; }
          echo "SDK root: $SDK"

          mkdir -p "$SDK/cmdline-tools"
          if [ ! -e "$SDK/cmdline-tools/latest" ]; then
            VER=$(ls -1 "$SDK/cmdline-tools" 2>/dev/null | grep -v '^latest$' | sort -V | tail -1 || true)
            if [ -n "$VER" ] && [ -d "$SDK/cmdline-tools/$VER" ]; then
              ln -sfn "$SDK/cmdline-tools/$VER" "$SDK/cmdline-tools/latest"
              echo "Symlink latest -> $VER creato."
            fi
          fi
          SDKMAN="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMAN" ] || { echo "::error::sdkmanager non eseguibile"; ls -la "$SDK/cmdline-tools" || true; exit 1; }

          yes 2>/dev/null | "$SDKMAN" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true

          # bubblewrap può pretendere una versione precisa di build-tools e
          # platform, diversa da quella che gli abbiamo indicato. Installiamo
          # il set plausibile: costa poco e elimina la variabile versione.
          "$SDKMAN" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-33" "platforms;android-34" "platforms;android-${ANDROID_API}" \
            "build-tools;33.0.2" "build-tools;34.0.0" "build-tools;${ANDROID_BUILD_TOOLS}" >/dev/null

          echo "── struttura della SDK root ──"
          ls -1 "$SDK"
          echo "── build-tools installati ──"
          ls -1 "$SDK/build-tools"
          echo "── platforms installati ──"
          ls -1 "$SDK/platforms"
          echo "── cmdline-tools ──"
          ls -la "$SDK/cmdline-tools"
          echo "── cerco una cartella chiamata 'build' ──"
          find "$SDK" -maxdepth 3 -type d -name build 2>/dev/null || echo "(nessuna)"
          echo "── cerco 'build' anche nella home del runner ──"
          find "$HOME" -maxdepth 4 -type d -name build 2>/dev/null || echo "(nessuna)"

          # Struttura nella posizione che bubblewrap usa quando installa l'SDK
          # da sé: i symlink riusano i componenti già scaricati, senza riscaricare.
          BW="$HOME/.bubblewrap/android-sdk"
          mkdir -p "$BW"
          for d in cmdline-tools platform-tools platforms build-tools licenses; do
            if [ -e "$SDK/$d" ]; then ln -sfn "$SDK/$d" "$BW/$d"; fi
          done
          echo "── struttura bubblewrap-native ──"
          ls -la "$BW"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Verifica prerequisiti del repo
        run: |
          test -f twa-manifest.json || { echo "::error::twa-manifest.json assente alla root"; exit 1; }
          test -f scripts/verify-apk.mjs || { echo "::error::scripts/verify-apk.mjs assente"; exit 1; }
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 mancante"; exit 1; }
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" || { echo "::error::Secret ANDROID_KEYSTORE_PASSWORD mancante"; exit 1; }
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}" || { echo "::error::Secret ANDROID_KEY_PASSWORD mancante"; exit 1; }
          node -e "const m=require('./twa-manifest.json'); if(!m.shareTarget){console.error('::error::twa-manifest.json senza shareTarget');process.exit(1)} if(m.shareTarget.method!=='POST'){console.error('::error::shareTarget.method deve essere POST');process.exit(1)} console.log('shareTarget:', m.shareTarget.action, '· alias:', (m.signingKey&&m.signingKey.alias)||'(assente)')"

      - name: Ricostruisci il keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -u
          CLEAN=$(printf '%s' "$KS_B64" | tr -d '[:space:]')
          printf '%s' "$CLEAN" | base64 -d > android.keystore
          chmod 600 android.keystore
          echo "keystore: $(wc -c < android.keystore | tr -d ' ') byte · magic $(od -An -tx1 -N4 android.keystore | tr -d ' \n')"
          OPENED=""
          for T in PKCS12 JKS JCEKS; do
            if keytool -list -keystore android.keystore -storetype "$T" -storepass "$KS_PASS" >/dev/null 2>/tmp/kterr; then
              OPENED="$T"; echo "aperto come $T"; break
            fi
          done
          if [ -z "$OPENED" ]; then
            echo "::error::keystore non apribile. stderr:"; head -8 /tmp/kterr; exit 1
          fi
          echo "ANDROID_KEYSTORE_TYPE=$OPENED" >> "$GITHUB_ENV"

      - name: Installa Bubblewrap
        run: npm install --no-audit --no-fund --ignore-scripts -g @bubblewrap/cli

      - name: Config iniziale Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' \
            "$JAVA_HOME" "$ANDROID_SDK_ROOT" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      # doctor ha detto: il percorso deve contenere una cartella "build".
      # Nessuna struttura standard la espone, quindi proviamo i candidati
      # reali e lasciamo che sia doctor a dirci quale accetta.
      - name: Risolvi androidSdkPath con doctor
        run: |
          set -u
          SDK="$ANDROID_SDK_ROOT"
          BW="$HOME/.bubblewrap/android-sdk"
          FOUND=""
          for CAND in "$BW" "$SDK" "$SDK/cmdline-tools/latest" "$SDK/cmdline-tools" "$SDK/build-tools/${ANDROID_BUILD_TOOLS}"; do
            if [ ! -d "$CAND" ]; then
              echo "--- $CAND : inesistente, salto"
              continue
            fi
            echo "=== provo $CAND ==="
            ls -1 "$CAND" | head -20
            bubblewrap updateConfig --androidSdkPath "$CAND" >/tmp/upd 2>&1 || { echo "updateConfig:"; tail -3 /tmp/upd; }
            if bubblewrap doctor >/tmp/doc 2>&1; then
              echo ">>> doctor ACCETTA $CAND"
              cat /tmp/doc
              FOUND="$CAND"
              break
            else
              echo "doctor rifiuta:"
              tail -6 /tmp/doc
            fi
          done

          if [ -z "$FOUND" ]; then
            echo ""
            echo "::error::Nessun percorso accettato da bubblewrap doctor."
            echo "Output completo dell'ultimo doctor:"
            cat /tmp/doc || true
            echo ""
            echo "config.json attuale:"
            cat "$HOME/.bubblewrap/config.json" || true
            echo ""
            echo "Struttura completa della SDK per diagnosi:"
            find "$SDK" -maxdepth 2 -type d 2>/dev/null | head -40
            exit 1
          fi

          bubblewrap updateConfig --androidSdkPath "$FOUND"
          echo "BW_ANDROID_SDK=$FOUND" >> "$GITHUB_ENV"
          echo "config.json finale:"
          cat "$HOME/.bubblewrap/config.json"

      - name: Build APK e AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Gate · consegna condivisione
        run: node scripts/verify-apk.mjs app-release-signed.apk

      - name: Fingerprint della chiave
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "Fingerprint SHA-256 (deve coincidere con assetlinks.json):"
          keytool -list -v -keystore android.keystore \
            -storetype "${ANDROID_KEYSTORE_TYPE:-PKCS12}" -storepass "$KS_PASS" \
            | grep -A1 "SHA256:" || true

      - name: Rimuovi il keystore dal workspace
        if: always()
        run: shred -u android.keystore 2>/dev/null || rm -f android.keystore

      - name: Pubblica APK e AAB
        uses: actions/upload-artifact@v4
        with:
          name: soundscript-android
          path: |
            app-release-signed.apk
            app-release-bundle.aab
          retention-days: 30
          if-no-files-found: error
