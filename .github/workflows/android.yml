name: android

on:
  workflow_dispatch:
    inputs:
      helper-bump:
        description: "Bump android-browser-helper all'ultima versione su Maven Central"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: false

env:
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.1.0"
  ANDROID_MIN_SDK: "24"
  APP_VERSION_NAME: "1.5.0"

jobs:
  build:
    name: TWA · build, gate, artifact
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'

      - name: Prepara le due forme dell'SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "::error::SDK non trovata in $SDK"; exit 1; }
          mkdir -p "$SDK/cmdline-tools"
          if [ ! -e "$SDK/cmdline-tools/latest" ]; then
            VER=$(ls -1 "$SDK/cmdline-tools" 2>/dev/null | grep -v '^latest$' | sort -V | tail -1 || true)
            [ -n "$VER" ] || { echo "::error::nessuna cmdline-tools versionata"; exit 1; }
            ln -sfn "$SDK/cmdline-tools/$VER" "$SDK/cmdline-tools/latest"
          fi
          CT="$SDK/cmdline-tools/latest"

          yes 2>/dev/null | "$CT/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$CT/bin/sdkmanager" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" >/dev/null

          # cmdline-tools/latest diventa una SDK root completa (symlink)
          for d in licenses platform-tools platforms build-tools extras; do
            if [ -e "$SDK/$d" ]; then ln -sfn "$SDK/$d" "$CT/$d"; fi
          done
          yes 2>/dev/null | "$CT/bin/sdkmanager" --sdk_root="$CT" --licenses >/dev/null 2>&1 || true

          # La root reale guadagna bin/ e lib/: così doctor può accettare anche lei
          for d in bin lib; do
            if [ -e "$CT/$d" ]; then ln -sfn "$CT/$d" "$SDK/$d"; fi
          done

          echo "SDK_REAL=$SDK" >> "$GITHUB_ENV"
          echo "SDK_CT=$CT" >> "$GITHUB_ENV"
          echo "── root reale ──"; ls -1 "$SDK"
          echo "── cmdline-tools/latest ──"; ls -1 "$CT"

      - name: Normalizza shareTarget e versione
        run: |
          node -e "
            const fs = require('fs');
            const p = './twa-manifest.json';
            const m = JSON.parse(fs.readFileSync(p, 'utf8'));
            const MIME = [
              'audio/*','audio/ogg','audio/mpeg','audio/mp4','audio/wav',
              'audio/x-wav','audio/aac','audio/flac','audio/webm',
              'audio/amr','audio/3gpp','audio/3gpp2','audio/x-m4a','audio/opus'
            ];
            const st = m.shareTarget || (m.shareTarget = {});
            st.action = st.action || '/share-target.html';
            st.method = 'POST';
            st.enctype = 'multipart/form-data';
            st.params = st.params || {};
            st.params.files = [{ name: 'audio', accept: MIME }];
            m.minSdkVersion = Math.max(m.minSdkVersion || 0, parseInt(process.env.ANDROID_MIN_SDK, 10));
            m.appVersionName = process.env.APP_VERSION_NAME;
            m.appVersionCode = parseInt(process.env.GITHUB_RUN_NUMBER, 10);
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
            console.log('accept: ' + MIME.length + ' MIME type, zero estensioni');
            console.log('versionName ' + m.appVersionName + ' · versionCode ' + m.appVersionCode);
            console.log('minSdk ' + m.minSdkVersion);
          "

      - name: Verifica prerequisiti del repo
        run: |
          test -f twa-manifest.json || { echo "::error::twa-manifest.json assente alla root"; exit 1; }
          test -f scripts/verify-apk.mjs || { echo "::error::scripts/verify-apk.mjs assente"; exit 1; }
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 mancante"; exit 1; }
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" || { echo "::error::Secret ANDROID_KEYSTORE_PASSWORD mancante"; exit 1; }
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}" || { echo "::error::Secret ANDROID_KEY_PASSWORD mancante"; exit 1; }
          node -e "
            const m = require('./twa-manifest.json');
            const acc = (m.shareTarget && m.shareTarget.params && m.shareTarget.params.files || []).flatMap(f => f.accept || []);
            const bad = acc.filter(a => /^\./.test(a));
            if (bad.length) { console.error('::error::accept contiene estensioni: ' + bad.join(', ')); process.exit(1); }
            if (!m.shareTarget || m.shareTarget.method !== 'POST') { console.error('::error::shareTarget.method deve essere POST'); process.exit(1); }
            console.log('accept pulito: ' + acc.length + ' MIME type');
          "

      - name: Ricostruisci il keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -u
          CLEAN=$(printf '%s' "$KS_B64" | tr -d '[:space:]')
          printf '%s' "$CLEAN" | base64 -d > android.keystore
          chmod 600 android.keystore
          echo "keystore: $(wc -c < android.keystore | tr -d ' ') byte"
          OPENED=""
          for T in PKCS12 JKS JCEKS; do
            if keytool -list -keystore android.keystore -storetype "$T" -storepass "$KS_PASS" >/dev/null 2>/tmp/kterr; then
              OPENED="$T"; echo "aperto come $T"; break
            fi
          done
          [ -n "$OPENED" ] || { echo "::error::keystore non apribile"; head -8 /tmp/kterr; exit 1; }
          echo "ANDROID_KEYSTORE_TYPE=$OPENED" >> "$GITHUB_ENV"

      - name: Rileva l'alias reale e allinea il manifest
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -u
          TYPE="${ANDROID_KEYSTORE_TYPE:-PKCS12}"
          LIST=$(keytool -list -keystore android.keystore -storetype "$TYPE" -storepass "$KS_PASS" 2>/dev/null)
          ALIAS=$(printf '%s\n' "$LIST" | grep -i 'PrivateKeyEntry' | head -1 | awk -F',' '{print $1}' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          [ -n "$ALIAS" ] || { echo "::error::nessuna PrivateKeyEntry nel keystore"; exit 1; }
          echo "Alias reale: $ALIAS"
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('./twa-manifest.json','utf8'));
            m.signingKey = m.signingKey || { path: './android.keystore' };
            m.signingKey.path = './android.keystore';
            m.signingKey.alias = process.argv[1];
            fs.writeFileSync('./twa-manifest.json', JSON.stringify(m, null, 2) + '\n');
            console.log('signingKey.alias -> ' + m.signingKey.alias);
          " "$ALIAS"
          echo "KS_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Installa Bubblewrap
        run: npm install --no-audit --no-fund --ignore-scripts -g @bubblewrap/cli

      - name: Scegli e allinea il percorso SDK
        run: |
          set -u
          mkdir -p "$HOME/.bubblewrap"
          CHOSEN=""
          for CAND in "$SDK_REAL" "$SDK_CT"; do
            echo "=== candidato: $CAND ==="
            printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' \
              "$JAVA_HOME" "$CAND" > "$HOME/.bubblewrap/config.json"
            if printf 'y\n' | bubblewrap doctor >/tmp/doc 2>&1; then
              echo ">>> doctor ACCETTA $CAND"; CHOSEN="$CAND"; break
            else
              echo "doctor rifiuta:"; tail -4 /tmp/doc
            fi
          done
          [ -n "$CHOSEN" ] || { echo "::error::nessun percorso accettato da doctor"; cat /tmp/doc || true; exit 1; }
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' \
            "$JAVA_HOME" "$CHOSEN" > "$HOME/.bubblewrap/config.json"
          # I tre valori DEVONO coincidere: AGP si ferma se divergono
          echo "ANDROID_HOME=$CHOSEN" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$CHOSEN" >> "$GITHUB_ENV"
          echo "BW_SDK=$CHOSEN" >> "$GITHUB_ENV"
          echo "$CHOSEN/bin" >> "$GITHUB_PATH"
          echo "$CHOSEN/platform-tools" >> "$GITHUB_PATH"
          echo "config.json finale:"
          cat "$HOME/.bubblewrap/config.json"

      - name: Genera il progetto Android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -u
          printf 'y\ny\ny\n' | bubblewrap update || echo "::warning::update non-zero, verifico lo stato"
          test -f app/build.gradle || { echo "::error::progetto Android non generato"; exit 1; }
          echo "── helper prima del bump ──"
          grep -n "androidbrowserhelper" app/build.gradle || true

      - name: Bump android-browser-helper (sperimentale)
        if: inputs.helper-bump == true
        run: |
          set -euo pipefail

          echo "=== Ricerca ultima versione su Maven Central ==="

          MAVEN_RESPONSE=$(curl -fsS --max-time 10 \
            "https://search.maven.org/solrsearch/select?q=g:com.google.androidbrowserhelper+AND+a:androidbrowserhelper&rows=1&wt=json" \
            2>/dev/null) || {
            echo "::warning::Impossibile raggiungere Maven Central (timeout o errore di rete)"
            echo "Mantengo la versione corrente di Bubblewrap"
            exit 0
          }

          LATEST=$(echo "$MAVEN_RESPONSE" | node -e "
            let d='';
            process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try {
                const r=JSON.parse(d);
                if(!r.response?.docs?.[0]?.latestVersion){
                  console.error('Risposta Maven non valida');
                  process.exit(1);
                }
                console.log(r.response.docs[0].latestVersion);
              } catch(e) {
                console.error('Errore parsing JSON:', e.message);
                process.exit(1);
              }
            });
            process.stdin.on('error',e=>{
              console.error('Errore stdin:', e.message);
              process.exit(1);
            });
          " 2>&1) || {
            echo "::warning::Errore nel parsing della risposta Maven"
            exit 0
          }

          if [ -z "$LATEST" ]; then
            echo "::warning::Nessuna versione trovata su Maven Central"
            exit 0
          fi
          echo "Ultima versione su Maven Central: $LATEST"

          if [ ! -f "app/build.gradle" ]; then
            echo "::error::app/build.gradle non trovato"
            exit 1
          fi

          BEFORE=$(grep -oE "com\.google\.androidbrowserhelper:androidbrowserhelper:[0-9.]+" app/build.gradle | head -1 || echo "")

          if [ -z "$BEFORE" ]; then
            echo "::warning::Dipendenza androidbrowserhelper non trovata in app/build.gradle"
            grep -n "androidbrowserhelper\|implementation.*browser" app/build.gradle || echo "(nessuna corrispondenza)"
            exit 0
          fi
          echo "Versione attuale (da Bubblewrap): $BEFORE"

          if echo "$BEFORE" | grep -qE ":$LATEST$"; then
            echo "Già all'ultima versione, nessuna modifica necessaria"
            exit 0
          fi

          echo "=== Applicazione patch ==="
          if sed -i -E "s|com\.google\.androidbrowserhelper:androidbrowserhelper:[0-9.]+|com.google.androidbrowserhelper:androidbrowserhelper:$LATEST|g" app/build.gradle; then
            echo "Patch applicato con successo"
            echo "── helper dopo il bump ──"
            grep -n "androidbrowserhelper" app/build.gradle
            echo "HELPER_BUMPED=$LATEST" >> "$GITHUB_ENV"
          else
            echo "::error::Fallimento nell'applicazione del patch con sed"
            exit 1
          fi

      - name: Allinea local.properties e verifica coerenza
        run: |
          set -u
          printf 'sdk.dir=%s\n' "$BW_SDK" > local.properties
          CFG=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.env.HOME+'/.bubblewrap/config.json','utf8')).androidSdkPath)")
          LOCAL=$(sed 's/^sdk.dir=//' local.properties)
          echo "ANDROID_HOME     = $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT = $ANDROID_SDK_ROOT"
          echo "config.json      = $CFG"
          echo "local.properties = $LOCAL"
          if [ "$ANDROID_HOME" != "$ANDROID_SDK_ROOT" ] || [ "$ANDROID_HOME" != "$CFG" ] || [ "$ANDROID_HOME" != "$LOCAL" ]; then
            echo "::error::Percorsi SDK divergenti: Gradle rifiuterebbe la build"
            exit 1
          fi
          echo "Tutti i percorsi coincidono."

      - name: Build APK e AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -u
          # Riscrive local.properties anche qui: bubblewrap potrebbe averla
          # rigenerata durante update con un percorso diverso
          printf 'sdk.dir=%s\n' "$BW_SDK" > local.properties
          printf 'y\ny\ny\n' | bubblewrap build --skipPwaValidation
          ls -1 *.apk *.aab 2>/dev/null || { echo "::error::nessun pacchetto prodotto"; exit 1; }

      - name: Gate · consegna condivisione
        run: node scripts/verify-apk.mjs app-release-signed.apk

      - name: Fingerprint della chiave
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "Fingerprint SHA-256 (deve coincidere con assetlinks.json):"
          keytool -list -v -keystore android.keystore \
            -storetype "${ANDROID_KEYSTORE_TYPE:-PKCS12}" \
            -alias "${KS_ALIAS}" -storepass "$KS_PASS" \
            | grep -A1 "SHA256:" || true

      - name: Rimuovi il keystore dal workspace
        if: always()
        run: shred -u android.keystore 2>/dev/null || rm -f android.keystore

      - name: Pubblica APK e AAB
        uses: actions/upload-artifact@v4
        with:
          name: soundscript-android
          path: |
            app-release-signed.apk
            app-release-bundle.aab
          retention-days: 30
          if-no-files-found: error
