name: android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    name: TWA · build, gate, artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Verifica prerequisiti
        run: |
          test -f twa-manifest.json || { echo "::error::twa-manifest.json assente alla root"; exit 1; }
          test -f scripts/verify-apk.mjs || { echo "::error::scripts/verify-apk.mjs assente"; exit 1; }
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 mancante"; exit 1; }
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" || { echo "::error::Secret ANDROID_KEYSTORE_PASSWORD mancante"; exit 1; }
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}" || { echo "::error::Secret ANDROID_KEY_PASSWORD mancante"; exit 1; }
          node -e "const m=require('./twa-manifest.json'); if(!m.shareTarget){console.error('::error::twa-manifest.json senza shareTarget: il pacchetto non avrebbe il consegnatario');process.exit(1)} if(m.shareTarget.method!=='POST'){console.error('::error::shareTarget.method deve essere POST');process.exit(1)} console.log('shareTarget dichiarato:', m.shareTarget.action)"

      # Il keystore viene solo decodificato dai Secrets. Non viene generato qui
      # e non finisce negli artifact: su un repo pubblico sarebbero leggibili
      # da chiunque, e la chiave di firma è l'identità dell'app.
      - name: Ricostruisci il keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS_B64" | base64 -d > android.keystore
          chmod 600 android.keystore
          keytool -list -keystore android.keystore -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >/dev/null
          echo "Keystore valido."

      - name: Installa Bubblewrap
        run: npm install --no-audit --no-fund --ignore-scripts -g @bubblewrap/cli

      - name: Configura Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF
          cat "$HOME/.bubblewrap/config.json"

      - name: Build APK e AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      # GATE: il pacchetto precedente aveva ACTION_SEND e audio/* ma non
      # ShareTargetActivity, quindi WhatsApp mostrava l'app e il file andava
      # perso. Senza questo controllo il difetto si ripete in silenzio.
      - name: Gate · consegna condivisione
        run: node scripts/verify-apk.mjs app-release-signed.apk

      - name: Fingerprint della chiave
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "Fingerprint SHA-256 (deve coincidere con assetlinks.json):"
          keytool -list -v -keystore android.keystore -storepass "$KS_PASS" \
            | grep -A1 "SHA256:" || true

      - name: Rimuovi il keystore dal workspace
        if: always()
        run: shred -u android.keystore 2>/dev/null || rm -f android.keystore

      - name: Pubblica APK e AAB
        uses: actions/upload-artifact@v4
        with:
          name: soundscript-android
          path: |
            app-release-signed.apk
            app-release-bundle.aab
          retention-days: 30
          if-no-files-found: error