name: android-init
description: "Genera o aggiorna il progetto Android nativo (Capacitor) e lo committa su main. Idempotente: rilanciabile senza danni."

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-init
  cancel-in-progress: false

env:
  APP_ID: studio.littleelsewhere.soundscript

jobs:
  bootstrap:
    name: Genera o aggiorna il progetto Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa dipendenze
        run: npm install --no-audit --no-fund

      - name: Build web
        run: npm run build

      - name: Crea la piattaforma Android (solo se assente)
        run: |
          if [ -d android ]; then
            echo "android/ già presente: salto cap add, aggiorno i file nativi."
          else
            CI=true npx cap add android
          fi

      - name: Rimuovi opzioni deprecate dalla config
        run: |
          node -e "
            const fs = require('fs');
            const p = 'capacitor.config.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            delete c.bundledWebRuntime;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "

      - name: Scrivi i file nativi personalizzati
        run: |
          set -e
          JDIR="android/app/src/main/java/studio/littleelsewhere/soundscript"
          mkdir -p "$JDIR"
          mkdir -p android/app/src/main/res/xml

          cat > android/app/src/main/AndroidManifest.xml <<'MANIFEST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="audio/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND_MULTIPLE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="audio/*" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
          </manifest>
          MANIFEST_EOF

          cat > android/app/src/main/res/xml/file_paths.xml <<'PATHS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-files-path name="updates" path="Download/" />
              <files-path name="internal" path="." />
              <cache-path name="cache" path="." />
              <external-path name="external" path="." />
          </paths>
          PATHS_EOF

          cat > "$JDIR/MainActivity.java" <<'ACTIVITY_EOF'
          package studio.littleelsewhere.soundscript;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(ShareReceiverPlugin.class);
              registerPlugin(SelfUpdatePlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          ACTIVITY_EOF

          cat > "$JDIR/ShareReceiverPlugin.java" <<'PLUGIN_EOF'
          package studio.littleelsewhere.soundscript;

          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.OpenableColumns;
          import android.util.Base64;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;

          @CapacitorPlugin(name = "ShareReceiver")
          public class ShareReceiverPlugin extends Plugin {
              private Intent pending = null;

              @Override
              public void handleOnNewIntent(Intent intent) {
                  pending = intent;
              }

              @PluginMethod
              public void takePendingShare(PluginCall call) {
                  Intent intent = pending != null ? pending
                          : (getActivity() != null ? getActivity().getIntent() : null);
                  pending = null;
                  JSObject ret = new JSObject();
                  if (intent == null
                          || (!Intent.ACTION_SEND.equals(intent.getAction())
                          && !Intent.ACTION_SEND_MULTIPLE.equals(intent.getAction()))) {
                      ret.put("none", true);
                      call.resolve(ret);
                      return;
                  }
                  Uri uri = intent.getParcelableExtra(Intent.EXTRA_STREAM);
                  if (uri == null) {
                      ret.put("none", true);
                      call.resolve(ret);
                      return;
                  }
                  try {
                      InputStream in = getContext().getContentResolver().openInputStream(uri);
                      if (in == null) throw new Exception("stream null");
                      ByteArrayOutputStream bos = new ByteArrayOutputStream();
                      byte[] buf = new byte[65536];
                      int r;
                      while ((r = in.read(buf)) > 0) bos.write(buf, 0, r);
                      in.close();
                      String mime = getContext().getContentResolver().getType(uri);
                      if (mime == null) mime = intent.getType();
                      if (mime == null) mime = "audio/ogg";
                      String name = queryName(uri);
                      if (name == null) name = "audio";
                      ret.put("none", false);
                      ret.put("name", name);
                      ret.put("type", mime);
                      ret.put("base64", Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP));
                      if (getActivity() != null) getActivity().setIntent(new Intent());
                      call.resolve(ret);
                  } catch (Exception e) {
                      ret.put("none", true);
                      ret.put("error", String.valueOf(e.getMessage()));
                      call.resolve(ret);
                  }
              }

              private String queryName(Uri uri) {
                  try {
                      Cursor c = getContext().getContentResolver().query(uri, null, null, null, null);
                      if (c == null) return null;
                      try {
                          int idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (idx >= 0 && c.moveToFirst()) return c.getString(idx);
                      } finally {
                          c.close();
                      }
                  } catch (Exception ignored) {
                  }
                  return null;
              }
          }
          PLUGIN_EOF

          cat > "$JDIR/SelfUpdatePlugin.java" <<'UPDATE_EOF'
          package studio.littleelsewhere.soundscript;

          import android.app.DownloadManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageInfo;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import androidx.core.content.ContextCompat;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileInputStream;
          import java.security.MessageDigest;

          @CapacitorPlugin(name = "SelfUpdate")
          public class SelfUpdatePlugin extends Plugin {
              private Long downloadId = null;
              private File target = null;
              private String expectedSha = null;
              private BroadcastReceiver receiver = null;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private Runnable poller = null;

              private boolean canInstallNow() {
                  return Build.VERSION.SDK_INT < 26 || getContext().getPackageManager().canRequestPackageInstalls();
              }

              @PluginMethod
              public void getInstalledVersion(PluginCall call) {
                  JSObject ret = new JSObject();
                  try {
                      PackageInfo pi = getContext().getPackageManager().getPackageInfo(getContext().getPackageName(), 0);
                      ret.put("versionName", pi.versionName == null ? "0.0.0" : pi.versionName);
                      ret.put("versionCode", Build.VERSION.SDK_INT >= 28 ? pi.getLongVersionCode() : pi.versionCode);
                  } catch (Exception e) {
                      ret.put("versionName", "0.0.0");
                      ret.put("versionCode", 0);
                  }
                  call.resolve(ret);
              }

              @PluginMethod
              public void canInstall(PluginCall call) {
                  JSObject ret = new JSObject();
                  ret.put("allowed", canInstallNow());
                  call.resolve(ret);
              }

              @PluginMethod
              public void openInstallSettings(PluginCall call) {
                  try {
                      Intent i = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                              Uri.parse("package:" + getContext().getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("settings: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void downloadAndInstall(PluginCall call) {
                  String url = call.getString("url");
                  expectedSha = call.getString("sha256");
                  if (url == null) { call.reject("url mancante"); return; }
                  if (!canInstallNow()) {
                      JSObject r = new JSObject(); r.put("needPermission", true); call.resolve(r); return;
                  }
                  try {
                      File dir = getContext().getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                      if (dir == null) dir = getContext().getFilesDir();
                      if (!dir.exists()) dir.mkdirs();
                      target = new File(dir, "SoundScript-update.apk");
                      if (target.exists()) target.delete();

                      final DownloadManager dm = (DownloadManager) getContext().getSystemService(Context.DOWNLOAD_SERVICE);
                      DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                      req.setTitle("SoundScript");
                      req.setDescription("Download aggiornamento");
                      req.setMimeType("application/vnd.android.package-archive");
                      req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE);
                      req.setAllowedOverMetered(true);
                      req.setAllowedOverRoaming(true);
                      req.setDestinationUri(Uri.fromFile(target));
                      downloadId = dm.enqueue(req);

                      receiver = new BroadcastReceiver() {
                          @Override public void onReceive(Context c, Intent i) {
                              long id = i.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1);
                              if (downloadId == null || id != downloadId) return;
                              stopPoller();
                              DownloadManager.Query q = new DownloadManager.Query();
                              q.setFilterById(downloadId);
                              Cursor cur = dm.query(q);
                              int status = -1;
                              if (cur != null && cur.moveToFirst()) {
                                  status = cur.getInt(cur.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                                  cur.close();
                              }
                              if (status == DownloadManager.STATUS_SUCCESSFUL) {
                                  verifyAndInstall();
                              } else {
                                  emitState("error", "Download fallito (status " + status + ")");
                              }
                          }
                      };
                      ContextCompat.registerReceiver(getContext(), receiver,
                              new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE),
                              ContextCompat.RECEIVER_EXPORTED);
                      startPoller(dm);
                      JSObject r = new JSObject(); r.put("started", true); call.resolve(r);
                  } catch (Exception e) {
                      call.reject("download: " + e.getMessage());
                  }
              }

              private void startPoller(final DownloadManager dm) {
                  poller = new Runnable() {
                      @Override public void run() {
                          if (downloadId == null) return;
                          DownloadManager.Query q = new DownloadManager.Query();
                          q.setFilterById(downloadId);
                          Cursor c = dm.query(q);
                          if (c != null && c.moveToFirst()) {
                              long done = c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR));
                              long total = c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES));
                              int status = c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                              c.close();
                              JSObject p = new JSObject();
                              p.put("bytes", done);
                              p.put("total", total);
                              p.put("percent", total > 0 ? (int) (done * 100 / total) : 0);
                              notifyListeners("progress", p);
                              if (status == DownloadManager.STATUS_RUNNING || status == DownloadManager.STATUS_PENDING) {
                                  handler.postDelayed(this, 400);
                              }
                          }
                      }
                  };
                  handler.post(poller);
              }

              private void stopPoller() { if (poller != null) handler.removeCallbacks(poller); poller = null; }

              private void verifyAndInstall() {
                  try {
                      if (expectedSha != null && !expectedSha.isEmpty()) {
                          emitState("verifying");
                          MessageDigest md = MessageDigest.getInstance("SHA-256");
                          FileInputStream in = new FileInputStream(target);
                          byte[] buf = new byte[65536]; int r;
                          while ((r = in.read(buf)) > 0) md.update(buf, 0, r);
                          in.close();
                          StringBuilder sb = new StringBuilder();
                          for (byte b : md.digest()) sb.append(String.format("%02x", b));
                          if (!sb.toString().equalsIgnoreCase(expectedSha.trim())) {
                              target.delete();
                              emitState("error", "Checksum non corrispondente: installazione annullata.");
                              return;
                          }
                      }
                      Uri uri = FileProvider.getUriForFile(getContext(),
                              getContext().getPackageName() + ".fileprovider", target);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(uri, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      emitState("installing");
                  } catch (Exception e) {
                      emitState("error", "Install: " + e.getMessage());
                  }
              }

              private void emitState(String state) { emitState(state, null); }

              private void emitState(String state, String message) {
                  JSObject o = new JSObject();
                  o.put("state", state);
                  if (message != null) o.put("message", message);
                  notifyListeners("state", o);
              }

              @Override
              public void handleOnDestroy() {
                  stopPoller();
                  if (receiver != null) {
                      try { getContext().unregisterReceiver(receiver); } catch (Exception ignored) {}
                      receiver = null;
                  }
              }
          }
          UPDATE_EOF

          cat > android/app/build.gradle <<'GRADLE_EOF'
          apply plugin: 'com.android.application'

          def vc = Integer.parseInt(System.getenv("APP_VERSION_CODE") ?: "1")
          def vn = System.getenv("APP_VERSION_NAME") ?: "1.6.0"

          android {
              namespace = "studio.littleelsewhere.soundscript"
              compileSdk = 34

              defaultConfig {
                  applicationId = "studio.littleelsewhere.soundscript"
                  minSdk = 22
                  targetSdk = 34
                  versionCode = vc
                  versionName = vn
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
                  aaptOptions {
                      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
                  }
              }

              signingConfigs {
                  release {
                      if (System.getenv("KS_PATH")) {
                          storeFile = file(System.getenv("KS_PATH"))
                          storePassword = System.getenv("KS_STORE_PASSWORD")
                          keyAlias = System.getenv("KS_KEY_ALIAS")
                          keyPassword = System.getenv("KS_KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled = false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                      if (System.getenv("KS_PATH")) {
                          signingConfig = signingConfigs.release
                      }
                  }
              }
          }

          repositories {
              flatDir {
                  dirs '../capacitor-cordova-android-plugins/src/main/libs', '../capacitor-cordova-android-plugins/src/main/jniLibs'
              }
          }

          dependencies {
              implementation fileTree(include: ['*.jar'], dir: 'libs')
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
              implementation "androidx.core:core-splashscreen:1.0.1"
              implementation project(':capacitor-android')
              testImplementation "junit:junit:4.13.2"
              androidTestImplementation "androidx.test.ext:junit:1.1.5"
              androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
              implementation project(':capacitor-cordova-android-plugins')
          }

          apply from: 'capacitor.build.gradle'

          try {
              def servicesJSON = file('google-services.json')
              if (servicesJSON.text) {
                  apply plugin: 'com.google.gms.google-services'
              }
          } catch(Exception e) {
              logger.info("google-services.json not found")
          }
          GRADLE_EOF

          echo "File nativi scritti."
          ls -1 "$JDIR"

      - name: Sincronizza il bundle web
        run: npx cap sync android

      - name: Commit del progetto Android e della config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android capacitor.config.json
          if git diff --cached --quiet; then
            echo "Niente da commitare."
          else
            git commit -m "chore(android): bootstrap/aggiorna progetto nativo Capacitor"
            git push origin HEAD:main
            echo "Progetto Android e config commitati su main."
          fi
