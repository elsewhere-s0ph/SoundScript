name: android-init

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-init
  cancel-in-progress: false

env:
  APP_ID: studio.littleelsewhere.soundscript

jobs:
  bootstrap:
    name: Genera e commita il progetto Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa dipendenze
        run: npm install --no-audit --no-fund

      - name: Build web
        run: npm run build

      - name: Crea la piattaforma Android
        run: CI=true npx cap add android

      - name: Scrivi i file nativi personalizzati
        run: |
          set -e
          JDIR="android/app/src/main/java/studio/littleelsewhere/soundscript"
          mkdir -p "$JDIR"

          cat > android/app/src/main/AndroidManifest.xml <<'MANIFEST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="audio/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND_MULTIPLE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="audio/*" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
              <uses-permission android:name="android.permission.INTERNET" />
          </manifest>
          MANIFEST_EOF

          cat > "$JDIR/MainActivity.java" <<'ACTIVITY_EOF'
          package studio.littleelsewhere.soundscript;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(ShareReceiverPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          ACTIVITY_EOF

          cat > "$JDIR/ShareReceiverPlugin.java" <<'PLUGIN_EOF'
          package studio.littleelsewhere.soundscript;

          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.OpenableColumns;
          import android.util.Base64;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;

          @CapacitorPlugin(name = "ShareReceiver")
          public class ShareReceiverPlugin extends Plugin {
              private Intent pending = null;

              @Override
              public void handleOnNewIntent(Intent intent) {
                  pending = intent;
              }

              @PluginMethod
              public void takePendingShare(PluginCall call) {
                  Intent intent = pending != null ? pending
                          : (getActivity() != null ? getActivity().getIntent() : null);
                  pending = null;
                  JSObject ret = new JSObject();
                  if (intent == null
                          || (!Intent.ACTION_SEND.equals(intent.getAction())
                          && !Intent.ACTION_SEND_MULTIPLE.equals(intent.getAction()))) {
                      ret.put("none", true);
                      call.resolve(ret);
                      return;
                  }
                  Uri uri = intent.getParcelableExtra(Intent.EXTRA_STREAM);
                  if (uri == null) {
                      ret.put("none", true);
                      call.resolve(ret);
                      return;
                  }
                  try {
                      InputStream in = getContext().getContentResolver().openInputStream(uri);
                      if (in == null) throw new Exception("stream null");
                      ByteArrayOutputStream bos = new ByteArrayOutputStream();
                      byte[] buf = new byte[65536];
                      int r;
                      while ((r = in.read(buf)) > 0) bos.write(buf, 0, r);
                      in.close();
                      String mime = getContext().getContentResolver().getType(uri);
                      if (mime == null) mime = intent.getType();
                      if (mime == null) mime = "audio/ogg";
                      String name = queryName(uri);
                      if (name == null) name = "audio";
                      ret.put("none", false);
                      ret.put("name", name);
                      ret.put("type", mime);
                      ret.put("base64", Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP));
                      if (getActivity() != null) getActivity().setIntent(new Intent());
                      call.resolve(ret);
                  } catch (Exception e) {
                      ret.put("none", true);
                      ret.put("error", String.valueOf(e.getMessage()));
                      call.resolve(ret);
                  }
              }

              private String queryName(Uri uri) {
                  try {
                      Cursor c = getContext().getContentResolver().query(uri, null, null, null, null);
                      if (c == null) return null;
                      try {
                          int idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (idx >= 0 && c.moveToFirst()) return c.getString(idx);
                      } finally {
                          c.close();
                      }
                  } catch (Exception ignored) {
                  }
                  return null;
              }
          }
          PLUGIN_EOF

          cat > android/app/build.gradle <<'GRADLE_EOF'
          apply plugin: 'com.android.application'

          android {
              namespace "studio.littleelsewhere.soundscript"
              compileSdkVersion rootProject.ext.compileSdkVersion
              defaultConfig {
                  applicationId "studio.littleelsewhere.soundscript"
                  minSdkVersion rootProject.ext.minSdkVersion
                  targetSdkVersion rootProject.ext.targetSdkVersion
                  versionCode (System.getenv("APP_VERSION_CODE") ?: "1") as int
                  versionName System.getenv("APP_VERSION_NAME") ?: "1.6.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
                  aaptOptions {
                      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
                  }
              }
              signingConfigs {
                  release {
                      if (System.getenv("KS_PATH")) {
                          storeFile file(System.getenv("KS_PATH"))
                          storePassword System.getenv("KS_STORE_PASSWORD")
                          keyAlias System.getenv("KS_KEY_ALIAS")
                          keyPassword System.getenv("KS_KEY_PASSWORD")
                      }
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                      if (System.getenv("KS_PATH")) {
                          signingConfig signingConfigs.release
                      }
                  }
              }
          }

          repositories {
              flatDir {
                  dirs '../capacitor-cordova-android-plugins/src/main/libs', '../capacitor-cordova-android-plugins/src/main/jniLibs'
              }
          }

          dependencies {
              implementation fileTree(include: ['*.jar'], dir: 'libs')
              implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
              implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
              implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
              implementation project(':capacitor-android')
              testImplementation "junit:junit:$junitVersion"
              androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
              androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
              implementation project(':capacitor-cordova-android-plugins')
          }

          apply from: 'capacitor.build.gradle'

          try {
              def servicesJSON = file('google-services.json')
              if (servicesJSON.text) {
                  apply plugin: 'com.google.gms.google-services'
              }
          } catch(Exception e) {
              logger.info("google-services.json not found")
          }
          GRADLE_EOF

          echo "File nativi scritti."
          ls -1 "$JDIR"

      - name: Sincronizza il bundle web
        run: npx cap sync android

      - name: Commit del progetto Android
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          if git diff --cached --quiet; then
            echo "Niente da commitare."
          else
            git commit -m "chore(android): bootstrap progetto nativo Capacitor"
            git push origin HEAD:main
            echo "Progetto Android commitato su main."
          fi