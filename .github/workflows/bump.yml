name: bump

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Incremento automatico (ignorato se compili 'version')"
        type: choice
        default: patch
        options:
          - patch   # 1.7.3 -> 1.7.4  (fix, piccole modifiche)
          - minor   # 1.7.3 -> 1.8.0  (nuove funzionalità)
          - major   # 1.7.3 -> 2.0.0  (cambiamenti rompenti)
      version:
        description: "Versione manuale, es. 1.8.0 (lascia vuoto per usare 'kind')"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bumpa versione, tag e release bozza con changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bumpa package.json
        id: ver
        run: |
          node -e "
            const fs = require('fs');
            const p = './package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            const [X, Y, Z] = pkg.version.split('.').map(Number);
            const manual = (process.env.MANUAL || '').trim();
            let next;
            let mode;
            if (manual) {
              if (!/^\d+\.\d+\.\d+$/.test(manual)) {
                console.error('::error::versione manuale non valida (atteso X.Y.Z): ' + manual);
                process.exit(1);
              }
              const [a, b, c] = manual.split('.').map(Number);
              const greater = (a > X) || (a === X && b > Y) || (a === X && b === Y && c > Z);
              if (!greater) {
                console.error('::error::la versione manuale ' + manual + ' non è maggiore dell attuale ' + pkg.version);
                process.exit(1);
              }
              next = [a, b, c];
              mode = 'manuale';
            } else {
              const kind = process.env.KIND;
              if (kind === 'major') next = [X + 1, 0, 0];
              else if (kind === 'minor') next = [X, Y + 1, 0];
              else next = [X, Y, Z + 1];
              mode = 'automatico (' + kind + ')';
            }
            pkg.version = next.join('.');
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            console.log('NEW=' + pkg.version + ' (' + mode + ')');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'new=' + pkg.version + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'mode=' + mode + '\n');
          "
        env:
          KIND: ${{ inputs.kind }}
          MANUAL: ${{ inputs.version }}

      - name: Genera changelog dai commit
        run: |
          PREV=$(git tag --sort=-v:refname | head -1 || true)
          echo "Release precedente: ${PREV:-nessuna}"
          cat > changelog-gen.mjs <<'GEN_EOF'
          import { execSync } from "node:child_process";
          import { writeFileSync } from "node:fs";
          const prev = process.argv[2] || "";
          const range = prev ? `${prev}..HEAD` : "HEAD";
          let raw = "";
          try { raw = execSync(`git log ${range} --pretty=%s`, { encoding: "utf8" }); } catch (e) { raw = ""; }
          const lines = raw.split("\n").map(s => s.trim()).filter(Boolean)
            .filter(s => !/^chore:\s*release/i.test(s))
            .filter(s => !/^Merge /i.test(s));
          const groups = { feat: [], fix: [], perf: [], refactor: [], docs: [], test: [], build: [], ci: [], chore: [], other: [] };
          for (const s of lines) {
            const m = s.match(/^(\w+)(\(.+\))?!?:\s*(.+)$/);
            if (!m) { groups.other.push(s); continue; }
            const t = m[1].toLowerCase();
            (groups[t] ? groups[t] : groups.other).push(m[3]);
          }
          const LABEL = {
            en: { feat: "Features", fix: "Fixes", perf: "Performance", refactor: "Refactoring", docs: "Docs", test: "Tests", build: "Build", ci: "CI", chore: "Maintenance", other: "Other" },
            it: { feat: "Nuove funzionalità", fix: "Correzioni", perf: "Prestazioni", refactor: "Refactoring", docs: "Documentazione", test: "Test", build: "Build", ci: "CI", chore: "Manutenzione", other: "Altro" }
          };
          function section(lang) {
            const L = LABEL[lang];
            let out = "";
            for (const k of Object.keys(L)) {
              if (!groups[k].length) continue;
              out += `### ${L[k]}\n`;
              for (const msg of groups[k]) out += `- ${msg}\n`;
              out += "\n";
            }
            return out || "- (nessun commit rilevato)\n\n";
          }
          const body =
            `<!-- BOZZA GENERATA DAI COMMIT. Rileggi, rifinisci e traduci dove serve, poi cancella questo commento. -->\n` +
            `## 🇬🇧 English\n\n` + section("en") +
            `---\n\n` +
            `## 🇮🇹 Italiano\n\n` + section("it");
          writeFileSync("release_body.md", body);
          console.log(body);
          GEN_EOF
          node changelog-gen.mjs "$PREV"

      - name: Commit e tag
        run: |
          NEW="${{ steps.ver.outputs.new }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release ${NEW}"
          git push origin HEAD:main
          git tag "v${NEW}"
          git push origin "v${NEW}"
          echo "Creato tag v${NEW}"

      - name: Apri release bozza con changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.new }}
          name: SoundScript v${{ steps.ver.outputs.new }}
          draft: true
          prerelease: false
          body_path: release_body.md

      - name: Riepilogo
        run: |
          echo "Versione: ${{ steps.ver.outputs.new }} · modo: ${{ steps.ver.outputs.mode }}"
          echo "Tag: v${{ steps.ver.outputs.new }}"
          echo "Release bozza con changelog precompilato: aprila, rifinisci, pubblica."
