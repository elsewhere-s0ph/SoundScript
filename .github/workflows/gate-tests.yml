name: gate-tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/gate-tests.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/gate-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test di regressione del gate APK
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Esegui i test del gate
        run: node --test scripts/verify-apk.test.mjs
